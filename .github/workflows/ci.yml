name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
      - name: Run tests
        run: |
          uv run -w unittest-xml-reporting -m xmlrunner discover
      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: Tests
          path: "TEST-*.xml"
          reporter: java-junit
